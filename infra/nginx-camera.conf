# Exemplo: proxy do gateway de vídeo validando o token curto emitido pela API.
# O app recebe apenas uma URL com ?token=..., nunca o RTSP nem a senha da câmera.
server {
  listen 443 ssl;
  server_name video.seu-condominio.example;

  location = /_auth {
    internal;
    proxy_pass http://API_HOST:3333/cameras/gateway/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  location /api/ {
    auth_request /_auth;
    proxy_pass http://127.0.0.1:1984;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
