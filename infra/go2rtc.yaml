# Gateway de vídeo. Cadastre os streams reais aqui (nome = campo stream_name da câmera no app).
# NUNCA exponha a porta 1984 direto na internet: publique atrás de um proxy (nginx/caddy)
# que valide o token curto emitido pela API (GET /cameras/gateway/auth) — ver infra/nginx-camera.conf.
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: "127.0.0.1:8554"
webrtc:
  listen: ":8555"
streams:
  # portao_frente: rtsp://usuario:senha@192.168.0.10:554/cam/realmonitor?channel=1&subtype=1
  # corredor_deck: rtsp://usuario:senha@192.168.0.11:554/Streaming/Channels/102
