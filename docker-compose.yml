services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: condominio
      POSTGRES_PASSWORD: condominio
      POSTGRES_DB: condominio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Gateway de vídeo (rodar no mini PC do condomínio, na mesma rede das câmeras).
  # Converte RTSP em WebRTC/HLS. Perfil opcional: docker compose --profile video up -d
  go2rtc:
    profiles: ["video"]
    image: alexxit/go2rtc
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/go2rtc.yaml:/config/go2rtc.yaml

volumes:
  pgdata:
